<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>build logic richtext</title> 
    <style>
        /* Global Unround */
        * { border-radius: 0 !important; box-sizing: border-box; }

        body { margin: 0; font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; }
        .container { padding: 20px; max-width: 1000px; margin: 0 auto; }
        
        h1 { color: #ffffff; margin-bottom: 20px; }

        #motd-toolbar { 
            margin-bottom: 20px; 
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .toolbar-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 5px;
        }

        .btn { 
            background: DeepSkyBlue; 
            color: white; 
            border: none; 
            padding: 8px 12px; 
            cursor: pointer; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            font-size: 14px;
            vertical-align: middle;
        }
        .btn:hover { background: #00bfff; }

        .swatch { width: 16px; height: 16px; display: inline-block; border: 1px solid rgba(255,255,255,0.3); }

        /* Custom Picker Logic */
        .custom-picker-container { 
            display: inline-flex; 
            height: 36px;
            vertical-align: middle;
            position: relative;
        }
        
        .custom-btn-main { margin: 0 !important; padding: 0 12px !important; border-right: 1px solid rgba(0,0,0,0.1); }
        
        .custom-btn-dropdown { 
            background: #444; 
            padding: 0 !important; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: 28px;
            height: 36px;
        }

        /* Fix for Firefox double icon */
        .hexPicker { 
            position: absolute; 
            opacity: 0; 
            width: 100%; 
            height: 100%; 
            cursor: pointer; 
            top:0; 
            left:0; 
            appearance: none;
            -moz-appearance: none;
            border: none;
        }

        .preview-square { width: 18px; height: 18px; border: 1px solid #fff; }
        
        #markLabel { 
            background: #ffff00; 
            color: #000; 
            padding: 2px 6px; 
            font-weight: bold;
            line-height: 1;
        }

        .dropdown-arrow { font-size: 10px; pointer-events: none; color: #ccc; }

        /* Searchable Font Dropdown */
        .font-search-container {
            position: absolute;
            top: 38px;
            left: 0;
            background: #222;
            border: 1px solid #444;
            z-index: 100;
            width: 200px;
            display: none;
            flex-direction: column;
        }
        .font-search-container.active { display: flex; }
        .font-search-input {
            background: #333;
            border: none;
            border-bottom: 1px solid #444;
            color: white;
            padding: 8px;
            outline: none;
        }
        .font-list {
            max-height: 200px;
            overflow-y: auto;
        }
        .font-item {
            padding: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .font-item:hover { background: DeepSkyBlue; }

        /* Editor Styling */
        #editor, #preview { 
            background-color: #1a1a1a; 
            color: #ffffff; 
            border: 1px solid #333; 
            padding: 15px; 
            width: 100%; 
            box-sizing: border-box; 
            font-size: 16px;
            margin-bottom: 20px;
        }

        label { 
            display: block; 
            font-weight: bold; 
            margin-bottom: 8px; 
            color: #ffffff; 
            font-size: 14px; 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>build logic richtext</h1>

    <div id="motd-toolbar">
        <div class="toolbar-row">
            <button class="btn" data-tag="font color='#000000'"><span class="swatch" style="background:#000"></span></button>
            <button class="btn" data-tag="font color='#0000AA'"><span class="swatch" style="background:#00A"></span></button>
            <button class="btn" data-tag="font color='#00AA00'"><span class="swatch" style="background:#0A0"></span></button>
            <button class="btn" data-tag="font color='#00AAAA'"><span class="swatch" style="background:#0AA"></span></button>
            <button class="btn" data-tag="font color='#AA0000'"><span class="swatch" style="background:#A00"></span></button>
            <button class="btn" data-tag="font color='#AA00AA'"><span class="swatch" style="background:#A0A"></span></button>
            <button class="btn" data-tag="font color='#FFAA00'"><span class="swatch" style="background:#FA0"></span></button>
            <button class="btn" data-tag="font color='#AAAAAA'"><span class="swatch" style="background:#AAA"></span></button>
            <button class="btn" data-tag="font color='#55FF55'"><span class="swatch" style="background:#5F5"></span></button>
            <button class="btn" data-tag="font color='#55FFFF'"><span class="swatch" style="background:#5FF"></span></button>
            <button class="btn" data-tag="font color='#FF5555'"><span class="swatch" style="background:#F55"></span></button>
            <button class="btn" data-tag="font color='#FFFFFF'"><span class="swatch" style="background:#FFF; border:1px solid #000"></span></button>
            
            <div class="custom-picker-container">
                <button class="btn custom-btn-main" id="applyCustomFont">
                    <span id="fontPreview" class="preview-square" style="background: #00ff00;"></span>
                </button>
                <div class="btn custom-btn-dropdown">
                    <span class="dropdown-arrow">▼</span>
                    <input type="color" id="fontHex" class="hexPicker" value="#00ff00">
                </div>
            </div>
        </div>

        <div class="toolbar-row">
            <button class="btn" data-tag="b"><b>B</b></button>
            <button class="btn" data-tag="u"><u>U</u></button>
            <button class="btn" data-tag="i"><i>I</i></button>
            <button class="btn" data-tag="s">S</button>
            
            <!-- Font Face Picker -->
            <div class="custom-picker-container">
                <button class="btn" id="fontFaceBtn" style="min-width: 100px;">Font: Arial</button>
                <div class="font-search-container" id="fontDropdown">
                    <input type="text" class="font-search-input" id="fontSearch" placeholder="Search font...">
                    <div class="font-list" id="fontList"></div>
                </div>
            </div>

            <div class="custom-picker-container">
                <button class="btn custom-btn-main" id="applyCustomMark">
                    <span id="markLabel">Mark</span>
                </button>
                <div class="btn custom-btn-dropdown">
                    <span class="dropdown-arrow">▼</span>
                    <input type="color" id="markHex" class="hexPicker" value="#ffff00">
                </div>
            </div>

            <button class="btn" data-tag="stroke thickness='2' color='#000000'">Stroke</button>
            <button class="btn" id="addBr">Break</button>
            <button class="btn" id="clearTags" style="background: #ff4444;">Reset</button>
        </div>
    </div>

    <label>Input:</label>
    <!-- Removed "today" from default text -->
    <textarea id="editor" rows="6">isnt <font color="#00FF00">richtext</font> cool?</textarea>

    <label>Preview:</label>
    <div id="preview" style="min-height:100px;"></div>
</div>

<script>
    const editor = document.getElementById("editor");
    const preview = document.getElementById("preview");
    const fontHex = document.getElementById("fontHex");
    const fontPreview = document.getElementById("fontPreview");
    const markHex = document.getElementById("markHex");
    const markLabel = document.getElementById("markLabel");

    // Roblox Font List
    const robloxFonts = ["Arial", "BuilderSans", "Gotham", "Roboto", "Ubuntu", "Arcade", "Fantasy", "Antique", "Cartoon", "Code", "SciFi", "Bodoni", "Garamond"];
    let selectedFont = "Arial";

    // Setup Font Dropdown
    const fontListEl = document.getElementById("fontList");
    const fontDropdown = document.getElementById("fontDropdown");
    const fontSearch = document.getElementById("fontSearch");
    const fontFaceBtn = document.getElementById("fontFaceBtn");

    function renderFonts(filter = "") {
        fontListEl.innerHTML = "";
        robloxFonts.filter(f => f.toLowerCase().includes(filter.toLowerCase())).forEach(font => {
            const div = document.createElement("div");
            div.className = "font-item";
            div.innerText = font;
            div.onclick = () => {
                selectedFont = font;
                fontFaceBtn.innerText = "Font: " + font;
                applyTag(`font face='${font}'`);
                fontDropdown.classList.remove("active");
            };
            fontListEl.appendChild(div);
        });
    }

    fontFaceBtn.onclick = (e) => {
        e.stopPropagation();
        fontDropdown.classList.toggle("active");
        if(fontDropdown.classList.contains("active")) fontSearch.focus();
    };

    fontSearch.oninput = (e) => renderFonts(e.target.value);
    document.onclick = () => fontDropdown.classList.remove("active");
    fontDropdown.onclick = (e) => e.stopPropagation();
    renderFonts();

    // Standard Tags
    document.querySelectorAll("[data-tag]").forEach(btn => {
        btn.onclick = () => applyTag(btn.dataset.tag);
    });

    fontHex.oninput = () => fontPreview.style.background = fontHex.value;
    markHex.oninput = () => markLabel.style.background = markHex.value;

    document.getElementById("applyCustomFont").onclick = () => applyTag(`font color='${fontHex.value.toUpperCase()}'`);
    document.getElementById("applyCustomMark").onclick = () => applyTag(`mark color='${markHex.value.toUpperCase()}'`);

    document.getElementById("addBr").onclick = () => {
        let start = editor.selectionStart;
        editor.value = editor.value.slice(0, start) + "<br/>" + editor.value.slice(start);
        update();
    };

    function applyTag(fullTag) {
        let tagName = fullTag.split(' ')[0]; 
        let start = editor.selectionStart;
        let end = editor.selectionEnd;
        let val = editor.value;
        editor.value = val.slice(0, start) + `<${fullTag}>` + val.slice(start, end) + `</${tagName}>` + val.slice(end);
        editor.focus();
        update();
    }

    document.getElementById("clearTags").onclick = () => {
        editor.value = editor.value.replace(/<[^>]*>/g, '');
        update();
    };

    function translateRobloxToHtml(text) {
        let html = text;
        // Stroke
        html = html.replace(/<stroke\s+([^>]+)>(.*?)<\/stroke>/gi, (match, attrs, content) => {
            const color = attrs.match(/color=['"]([^'"]+)['"]/)?.[1] || "#000";
            const thick = attrs.match(/thickness=['"]([^'"]+)['"]/)?.[1] || "1";
            const shadow = `-${thick}px -${thick}px 0 ${color}, ${thick}px -${thick}px 0 ${color}, -${thick}px ${thick}px 0 ${color}, ${thick}px ${thick}px 0 ${color}`;
            return `<span style="text-shadow: ${shadow}">${content}</span>`;
        });
        // Font (Color and Face)
        html = html.replace(/<font\s+([^>]+)>(.*?)<\/font>/gi, (match, attrs, content) => {
            const color = attrs.match(/color=['"]([^'"]+)['"]/)?.[1];
            const face = attrs.match(/face=['"]([^'"]+)['"]/)?.[1];
            let style = "";
            if(color) style += `color: ${color};`;
            if(face) style += `font-family: ${face}, Arial;`;
            return `<span style="${style}">${content}</span>`;
        });
        // Mark
        html = html.replace(/<mark\s*([^>]*)>(.*?)<\/mark>/gi, (match, attrs, content) => {
            const color = attrs.match(/color=['"]([^'"]+)['"]/)?.[1] || "#ffff00";
            return `<mark style="background-color: ${color}; color: #000; padding: 0 4px;">${content}</mark>`;
        });
        return html.replace(/\n/g, '<br/>');
    }

    function update() {
        preview.innerHTML = translateRobloxToHtml(editor.value);
    }

    editor.addEventListener("input", update);
    update();
</script>
</body>
</html>
