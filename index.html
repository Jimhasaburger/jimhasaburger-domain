<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint's website</title>
    <!-- discord embed -->
      <meta property="og:title" content="Mint's Website">
      <meta property="og:description" content="I bought a domain! this is my website.">
      <meta property="og:type" content="website">
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="styles.css">
    <script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    
    if (params.get('aero') === 'true') {
      // 1. Add the CSS
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://unpkg.com/7.css';
      document.head.appendChild(link);
      document.documentElement.classList.add('win7-active');

      // 2. Wait for DOM to load to restructure the page
      window.addEventListener('DOMContentLoaded', () => {
        const body = document.body;
        const originalContent = body.innerHTML;
        
        // 3. Wrap everything in the Windows 7 frame
        body.innerHTML = `
          <div class="window glass" style="width: 800px; max-width: 95%; margin: 50px auto;">
            <div class="title-bar">
              <div class="title-bar-text">Mint's Website</div>
              <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
              </div>
            </div>
            <div class="window-body">
              ${originalContent}
            </div>
            <div class="status-bar">
              <p class="status-bar-field">Done</p>
              <p class="status-bar-field"></p>
              <p class="status-bar-field">100%</p>
            </div>
          </div>
        `;
      });
    }
  })();
</script>
</head>
<body>
    <header>
    <h1>Mint's website</h1>
    <nav>
        <a href="/">Home</a>
        <a href="/names">list of names</a>
        <a href="/links">links</a>
        <a href="/games">games</a>
        <a href="/test">testing page</a>
    </nav>
    </header>
    <div class="container">
        <h1>Welcome!</h1>
        <p>I bought a domain!</p>
    </div>
</body>
</html>
