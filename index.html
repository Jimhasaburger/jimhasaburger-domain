<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint's website</title>
    <!-- discord embed -->
      <meta property="og:title" content="Mint's Website">
      <meta property="og:description" content="I bought a domain! this is my website.">
      <meta property="og:type" content="website">
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="styles.css">
    <script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('aero') === 'true') {
      // Load 7.css
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://unpkg.com/7.css';
      document.head.appendChild(link);
      
      // Tell the CSS to activate the overrides
      document.documentElement.classList.add('win7-active');
      
      // Optional: Add the "glass" class to your container automatically
      window.addEventListener('DOMContentLoaded', () => {
          document.querySelector('.container')?.classList.add('window', 'glass');
          document.querySelector('header')?.classList.add('window', 'glass');
      });
    }
  })();
</script>
</head>
<body>
    <header>
    <h1>Mint's website</h1>
    <nav>
        <a href="/">Home</a>
        <a href="/names">list of names</a>
        <a href="/links">links</a>
        <a href="/games">games</a>
        <a href="/test">testing page</a>
    </nav>
    </header>
    <div class="container">
        <h1>Welcome!</h1>
        <p>I bought a domain!</p>
    </div>
</body>
</html>
