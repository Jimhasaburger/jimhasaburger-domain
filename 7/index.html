<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint's Website - Windows 7 Edition</title>
    <!-- Importing 7.css from the CDN mentioned in the documentation -->
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    <link rel="stylesheet" href="https://jimhasaburger.com/7/styles.css">
</head>
<body class="win7-background">

    <!-- Main Fullscreen Window Container -->
    <div class="window active glass fullscreen-window">
        <!-- Title Bar -->
        <div class="title-bar">
            <div class="title-bar-text">Mint's Website - Home</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
            </div>
        </div>

        <!-- Menu Bar (Navigation) -->
        <div class="window-body">
            <ul role="menubar" class="can-hover">
                <li role="menuitem"><a href="/">Home</a></li>
                <li role="menuitem"><a href="/names">List of names</a></li>
                <li role="menuitem"><a href="/links">Links</a></li>
                <li role="menuitem"><a href="/games">Games</a></li>
                <li role="menuitem"><a href="/test">Testing Page</a></li>
            </ul>

            <!-- Main Content Area -->
            <div class="content-padding">
                <h1>Welcome!</h1>
                <p>I bought a domain!</p>
                
                <fieldset>
                    <legend>System Status</legend>
                    <p>Current Theme: Windows 7 Aero</p>
                    <div role="progressbar" class="animate">
                        <div style="width: 100%"></div>
                    </div>
                </fieldset>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <p class="status-bar-field">Ready</p>
            <p class="status-bar-field">Connected to Mint-Net</p>
            <p class="status-bar-field">100% Awesome</p>
        </div>
    </div>

</body>
</html>
