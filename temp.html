<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    padding: 20px;
}

h1 { font-size: 20px; }

textarea {
    width: 100%;
    height: 140px;
    background: #1a1d25;
    color: #fff;
    border: 1px solid #333;
    padding: 8px;
    font-family: monospace;
    resize: vertical;
}

button {
    padding: 8px 12px;
    margin: 5px 5px 10px 0;
    cursor: pointer;
    background: #2d6cdf;
    border: none;
    color: white;
    border-radius: 4px;
}
</style>
</head>
<body>
<h3>JSON</h3>
<textarea id="blockInput">{
  "id": "stone",
  "pos": {"X": 1, "Y": 2, "Z": 3},
  "rot": 5,
  "worldId": 2,
  "connections": [[1,2],[3,4]],
  "data": {"hp": 100}
}</textarea>

<button onclick="uiEncodeBlock()">Encode</button>
<pre id="blockOut"></pre>

<script>
<h3>Save String</h3>
<textarea id="saveInput"></textarea>
<button onclick="uiDecodeSave()">Decode</button>
<pre id="saveOut"></pre>

<script>
<script>
/* =========================
   BASE71
========================= */
const BASE71 = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!@$%?&<()";
const CHAR_TO_VAL = {};

for (let i = 0; i < BASE71.length; i++) {
    CHAR_TO_VAL[BASE71[i]] = i;
}

function encodeBase71(n) {
    n = Math.floor(n);
    if (n === 0) return "0";

    let out = "";
    while (n > 0) {
        const r = n % 71;
        n = Math.floor(n / 71);
        out = BASE71[r] + out;
    }
    return out;
}

function decodeBase71(str) {
    let n = 0;
    for (let c of str) {
        let v = CHAR_TO_VAL[c];
        if (v === undefined) {
            if (c !== "0") throw new Error("Invalid Base71: " + c);
            v = 0;
        }
        n = n * 71 + v;
    }
    return n;
}

/* =========================
   POSITION PACKING
========================= */
function packPos(x,y,z){
    return x + y * 256 + z * 65536;
}

function unpackPos(n){
    return {
        X: n % 256,
        Y: Math.floor(n / 256) % 256,
        Z: Math.floor(n / 65536)
    };
}

/* =========================
   CORE SAVE CODEC (NO UI)
========================= */
function encodeBlockData(block){
    let sections = [];

    sections.push(block.id);

    if (block.pos){
        const packed = packPos(block.pos.X, block.pos.Y, block.pos.Z);
        sections.push(encodeBase71(packed));
    }

    if (block.rot != null){
        sections.push("r" + encodeBase71(block.rot));
    }

    if (block.worldId != null){
        sections.push("w" + encodeBase71(block.worldId));
    }

    if (block.connections?.length){
        const conns = block.connections.map(c =>
            encodeBase71(c[0]) + "-" + encodeBase71(c[1])
        );
        sections.push("c" + conns.join(","));
    }

    if (block.data && Object.keys(block.data).length){
        sections.push("d" + JSON.stringify(block.data));
    }

    return sections.join(".") + ";";
}

function decodeBlockData(str){
    let result = {};
    const parts = str.split(".");

    result.id = parts[0];

    for (let i = 1; i < parts.length; i++){
        const p = parts[i];
        const prefix = p[0];

        if (prefix === "r"){
            result.rot = decodeBase71(p.slice(1));
        }
        else if (prefix === "w"){
            result.worldId = decodeBase71(p.slice(1));
        }
        else if (prefix === "c"){
            result.connections = p.slice(1).split(",").map(pair=>{
                const [a,b] = pair.split("-");
                return [decodeBase71(a), decodeBase71(b)];
            });
        }
        else if (prefix === "d"){
            result.data = JSON.parse(p.slice(1));
        }
        else {
            result.pos = unpackPos(decodeBase71(p));
        }
    }

    return result;
}

function encodeSaveData(blocks){
    return blocks.map(encodeBlockData).join("");
}

function decodeSaveData(save){
    return save.split(";").filter(Boolean).map(decodeBlockData);
}

/* =========================
   UI LAYER (NO RECURSION)
========================= */
function uiEncodeBlock(){
    try {
        const obj = JSON.parse(document.getElementById("blockInput").value);
        const out = encodeBlockData(obj);
        document.getElementById("blockOut").textContent = out;

        document.getElementById("saveInput").value += out;

    } catch (e){
        document.getElementById("blockOut").textContent = "Error: " + e.message;
    }
}

function uiDecodeBlock(){
    try {
        const str = document.getElementById("blockOut").textContent.trim();
        const obj = decodeBlockData(str);
        document.getElementById("blockOut").textContent =
            JSON.stringify(obj, null, 2);
    } catch (e){
        document.getElementById("blockOut").textContent = "Error: " + e.message;
    }
}

function uiEncodeSave(){
    try {
        const text = document.getElementById("blockInput").value;
        const obj = JSON.parse(text);

        const arr = Array.isArray(obj) ? obj : [obj];

        const out = encodeSaveData(arr);

        document.getElementById("saveOut").textContent = out;
        document.getElementById("saveInput").value = out;

    } catch (e){
        document.getElementById("saveOut").textContent = "Error: " + e.message;
    }
}

function uiDecodeSave(){
    try {
        const save = document.getElementById("saveInput").value;
        const obj = decodeSaveData(save);

        document.getElementById("saveOut").textContent =
            JSON.stringify(obj, null, 2);

    } catch (e){
        document.getElementById("saveOut").textContent = "Error: " + e.message;
    }
}
</script>

</body>
</html>
